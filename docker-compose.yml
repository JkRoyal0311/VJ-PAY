version: '3.8'

services:
  # ---------------------------------------------
  # Database Service (MySQL)
  # ---------------------------------------------
  db:
    image: mysql:8.0
    container_name: vjpay_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: paymentdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ---------------------------------------------
  # Backend Service (Spring Boot)
  # ---------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: vjpay_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Override the localhost URL to point to the 'db' container
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/paymentdb?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------
  # Frontend Service (Angular via Nginx)
  # ---------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: vjpay_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
